<style>

    box-sizing: border-box;

    --bg: #faf6f1;
    --card: #fff;
    --ink: #22252e;
    --mut: #6b6f7b;
    --line: #e6dfd6;
    --red: #b81d24;
    --blue: #2980b9;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
@media(prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
        --bg: #15171c; --card: #1e2128; --ink: #ecebe8; --mut: #9a9ea9; --line: #2d313b; --red: #ee5a60; --blue: #3498db;
    }
}
:root[data-theme=dark] {
    --bg: #15171c; --card: #1e2128; --ink: #ecebe8; --mut: #9a9ea9; --line: #2d313b; --red: #ee5a60; --blue: #3498db;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
header { padding: 16px 14px 8px; }
h1 { font: 700 20px/1.15 Georgia, 'Times New Roman', serif; margin: 0; }
h1 b { color: var(--red); }
.sub { color: var(--mut); font-size: 12px; margin: 4px 0 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    font: 600 14px inherit;
    cursor: pointer;
    transition: 0.2s;
}
.tabs button.on {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
}
main { padding: 0 12px 40px; }
input {
    width: 100%;
    margin: 10px 0;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    font: 15px inherit;
}
ul { list-style: none; margin: 0; padding: 0; }
.root > li { margin-bottom: 8px; }
details.b {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--c);
    border-radius: 12px;
    overflow: hidden;
}
summary {
    cursor: pointer;
    padding: 11px 12px;
    font-weight: 600;
    list-style: none;
    display: flex;
    gap: 8px;
    align-items: center;
}
summary::-webkit-details-marker { display: none; }
summary::after {
    content: '+';
    margin-left: auto;
    color: var(--mut);
    font-weight: 400;
}
details[open] > summary::after { content: '–'; }
details.b > summary { font-size: 16px; }
details ul { padding: 0 10px 8px 12px; }
details ul li {
    padding: 5px 0 5px 10px;
    border-left: 2px solid var(--line);
    margin-left: 4px;
    font-size: 14px;
}
details ul details > summary { padding: 4px 0; font-size: 14px; color: var(--c); }
.root { --c: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip {
    padding: 8px 11px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 20px;
    font: 13px inherit;
    cursor: pointer;
    transition: 0.2s;
}
.chip.on {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
}
.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.card h2 { font: 700 18px Georgia, serif; margin: 0 0 4px; color: var(--ink); }
.card .tagline { color: var(--mut); font-size: 13px; margin-bottom: 16px; font-style: italic; }
.card h3 {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--red);
    margin: 16px 0 6px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
}
.card p { margin: 0 0 8px 0; font-size: 14px; line-height: 1.5; }
[hidden] { display: none !important; }
.f { color: var(--mut); font-size: 11px; margin-top: 16px; text-align: center; }
</style>

const $ = s => document.querySelector(s);
const L = n => typeof n === 'string' ? `<li>${n}</li>` : `<li><details><summary>${n.n}</summary><ul>${n.k.map(L).join('')}</ul></details></li>`;

$('#tree').innerHTML = M.map(b => `<li><details class="b" style="--c:${b.c}"><summary>${b.i} ${b.n}</summary><ul>${b.k.map(L).join('')}</ul></details></li>`).join('');

function vis(li, q) {
    const d = li.querySelector(':scope>details');
    if (!d) {
        const v = !q || li.textContent.toLowerCase().includes(q);
        li.hidden = !v;
        return v;
    }
    const sm = !q || d.firstElementChild.textContent.toLowerCase().includes(q);
    const r = [...d.querySelector(':scope>ul').children].map(c => vis(c, sm ? '' : q));
    const v = sm || r.some(Boolean);
    li.hidden = !v;
    d.open = !!q && v;
    return v;
}

$('#q').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    [...$('#tree').children].forEach(li => vis(li, q));
};

function show(i) {
    $('#chips').querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j == i));
    const a = A[i];
    const s = (h, v) => v ? `<h3>${h}</h3><p>${v}</p>` : '';
    $('#card').innerHTML = `<h2>${a.n}</h2><div class="tagline">${a.t}</div>
        ${s('Investigations', a.dx)}
        ${s('Treatment Options', a.tx)}
        ${s('Home Care Kits', a.hc)}
        ${s('Supplements & IV Therapy', a.sp)}
    `;
}

$('#chips').innerHTML = A.map((a, i) => `<button class="chip">${a.n}</button>`).join('');
$('#chips').onclick = e => {
    const i = [...$('#chips').children].indexOf(e.target);
    if (i >= 0) show(i);
};
show(0);

$('#t1').onclick = () => tab(1);
$('#t2').onclick = () => tab(2);

function tab(n) {
    $('#map').hidden = n != 1;
    $('#adv').hidden = n != 2;
    $('#t1').classList.toggle('on', n == 1);
    $('#t2').classList.toggle('on', n == 2);
}

document.getElementById("themeBtn").onclick = () => {
    let r = document.documentElement;
    r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
};
</script>
